name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: proxy/package-lock.json
      - name: Install deps
        working-directory: proxy
        run: npm ci
      - name: Typecheck
        working-directory: proxy
        run: npm run typecheck
      - name: Lint
        working-directory: proxy
        run: npm run lint
      - name: Unit tests
        working-directory: proxy
        run: npm test
      - name: Docker build
        run: docker build -t local/opencode-openai-api-proxy:ci .
